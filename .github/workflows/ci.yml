name: ci

on:
  push:
  pull_request:

jobs:
  test-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The same toolchain as the build machine, so env/score reports the
      # rustc the owner sees locally.
      - name: Install Rust 1.97.0
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # The cache is off because its file search follows the test vault's
      # symlink out of the repository and fails on a folder it cannot read.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: cargo fmt
        working-directory: server
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: server
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: server
        run: cargo test --locked

      - name: verifier self-test
        run: verifier/selftest

      - name: env/score self-test
        run: env/test-score

      - name: env/score --phase 2
        run: env/score --phase 2

      - name: Keep the score report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: env/out/
          if-no-files-found: ignore
