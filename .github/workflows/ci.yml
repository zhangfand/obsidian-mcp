name: ci

on:
  push:
  pull_request:

jobs:
  test-and-score:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The same toolchain as the build machine, so env/score reports the
      # rustc the owner sees locally.
      - name: Install Rust 1.97.0
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # The cache is off because its file search follows the test vault's
      # symlink out of the repository and fails on a folder it cannot read.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: cargo fmt
        working-directory: server
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: server
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: server
        run: cargo test --locked

      - name: verifier self-test
        run: verifier/selftest

      - name: env/score self-test
        run: env/test-score

      - name: env/score --phase 2
        run: env/score --phase 2

      - name: Keep the score report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: env/out/
          if-no-files-found: ignore

      # The owner's rule: a pull request merges itself once every check above
      # has passed. A pull request from a fork gets a read-only token, so it
      # is left for a person.
      - name: Merge the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --squash --match-head-commit ${{ github.event.pull_request.head.sha }}
