[package]
name = "transport"
version.workspace = true
edition.workspace = true

[[bin]]
name = "obsidian-mcp"
path = "src/main.rs"

[dependencies]
tools = { path = "../tools" }
vault = { path = "../vault" }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
